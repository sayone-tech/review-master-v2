{% load static %}<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Something went wrong · Review Master</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}" />
    <link rel="icon" href="{% static 'favicon.ico' %}" />
  </head>
  <body class="min-h-screen bg-white flex flex-col items-center justify-center p-8">
    <div class="flex flex-col items-center text-center max-w-[480px]">
      <div style="height:78px;overflow:hidden;margin-bottom:32px;display:flex;justify-content:center;align-items:flex-start;">
        <img src="{% static 'main_logo.png' %}" alt="Review Master" style="height:220px;width:auto;margin-top:-62px;">
      </div>
      <p class="text-[48px] font-bold text-faint leading-none mb-2">500</p>
      <h1 class="text-[20px] font-bold text-ink mb-2">Something went wrong</h1>
      <p class="text-[14px] text-muted text-center mb-6 max-w-[320px]">
        We encountered an unexpected error. Our team has been notified.
      </p>
      {% if request.user.is_authenticated %}
        <a href="/admin/org/dashboard/" class="px-6 py-3 bg-black text-yellow font-semibold rounded-md text-[14px] hover:bg-ink/90">Go to Dashboard</a>
      {% else %}
        <a href="/accounts/login/" class="px-6 py-3 bg-black text-yellow font-semibold rounded-md text-[14px] hover:bg-ink/90">Go to Login</a>
      {% endif %}
    </div>
  </body>
</html>
