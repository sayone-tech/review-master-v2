<!DOCTYPE html>
<html>
  <head>
    <title>Connect Google Business Profile</title>
    <meta name="viewport" content="width=device-width">
  </head>
  <body>
    {% if oauth_error_code %}
      <script>
        window.opener && window.opener.postMessage(
          {type: "oauth_error", code: "{{ oauth_error_code|escapejs }}"},
          window.location.origin
        );
        setTimeout(() => window.close(), 50);
      </script>
      <p>Connection error. You can close this window.</p>
    {% else %}
      <script>
        window.opener && window.opener.postMessage(
          {type: "oauth_listings", state: "{{ state|escapejs }}", listings: {{ listings_json|safe }}},
          window.location.origin
        );
        setTimeout(() => window.close(), 50);
      </script>
      <p>Connected. You can close this window.</p>
    {% endif %}
  </body>
</html>
