{% load ui %}
{% is_active_route item.href as active %}
<li>
  <a
    href="{{ item.href }}"
    class="
           relative flex items-center gap-2.5
           px-2.5 py-2 rounded-[9px]
           text-[13.5px]
           focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow
           {% if active %}
             bg-yellow text-black font-semibold
           {% else %}
             font-medium text-[#D4D4D8] hover:text-white hover:bg-white/[0.06]
           {% endif %}
          "
    {% if active %}aria-current="page"{% endif %}
    data-testid="nav-item-{{ item.label|lower }}"
    title="{{ item.label }}"
  >
    <span class="w-[18px] h-[18px] shrink-0" aria-hidden="true" data-lucide="{{ item.icon }}"></span>
    <span class="md:hidden lg:inline truncate">{{ item.label }}</span>
    {% if item.badge_key %}
      <span
        data-nav-badge="{{ item.badge_key }}"
        hidden
        class="
               ml-auto rounded-full text-center font-semibold
               md:absolute md:right-1.5 md:top-1 md:h-2 md:w-2 md:p-0 md:text-[0] md:bg-yellow
               lg:static lg:h-auto lg:w-auto lg:min-w-[20px] lg:px-1.5 lg:text-[11px] lg:leading-[18px]
               {% if active %}lg:bg-black lg:text-yellow{% else %}lg:bg-[#27272A] lg:text-[#E4E4E7]{% endif %}
              "
      ></span>
    {% endif %}
  </a>
</li>
