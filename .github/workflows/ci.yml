name: CI

# Pull requests: CI always runs. Branch protection on `main` requires the
# backend-pg / backend-test / frontend-test / lint-typecheck checks, so a
# docs-only PR that skipped CI would never report them and could not merge.
#
# Pushes to main: skip CI (and therefore Deploy, which chains off CI's
# workflow_run) when a commit only touches documentation, license, or other
# non-build files. A commit that touches BOTH docs and code still triggers CI —
# paths-ignore only skips when EVERY changed file matches the ignore list.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
      - ".gitattributes"

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend tests (Vitest)
        run: npm test
        working-directory: frontend

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pre-commit
        run: uv run pre-commit run --all-files

      - name: Mypy
        run: uv run mypy .

      - name: Migration check
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Deployment check
        run: uv run python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Celery smoke test (INFRA-07)
        run: timeout 30s uv run pytest apps/common/tests/test_celery_smoke.py -x -q --no-cov
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Pytest with coverage
        run: uv run pytest --cov=apps --cov-fail-under=85
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  backend-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway CI-only credentials for an ephemeral service container.
          POSTGRES_DB: reviewmaster
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U app -d reviewmaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Postgres concurrency tests (CQA-01)
        run: uv run pytest --ds=config.settings.test_pg -m pg_concurrency --no-cov -rs
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/reviewmaster
          REQUIRE_PG: "1"
