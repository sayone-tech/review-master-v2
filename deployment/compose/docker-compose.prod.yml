# Production Docker Compose for the single-EC2 deployment.
# See deployment/README.md for the full architecture.
#
# Usage on the EC2 box (handled automatically by deployment/scripts/deploy.sh):
#   1. load-secrets.sh writes all SSM params to /etc/review-master.env
#   2. ECR_IMAGE is exported as a shell variable by deploy.sh
#   3. docker compose -f docker-compose.prod.yml pull && up -d
#
# The image is built and pushed by GitHub Actions to ECR. This file does not
# build — it only runs.

x-app: &app
  image: ${ECR_IMAGE}
  restart: unless-stopped
  env_file: /etc/review-master.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
  depends_on:
    redis:
      condition: service_healthy

x-awslogs: &awslogs
  driver: awslogs
  options:
    awslogs-region: ap-south-1
    awslogs-group: /review-master/prod
    awslogs-create-group: "true"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: /etc/review-master.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /opt/review-master/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging:
      <<: *awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /review-master/prod
        awslogs-stream: caddy
        awslogs-create-group: "true"

  web:
    <<: *app
    command: daphne -b 0.0.0.0 -p 8000 --proxy-headers config.asgi:application
    expose:
      - "8000"
    healthcheck:
      # Set Host header to the real domain so Django's ALLOWED_HOSTS check
      # doesn't reject the healthcheck. Fixes Sentry PYTHON-DJANGO-2.
      test: ["CMD", "curl", "-fsS", "-H", "Host: app.reviewbee.in", "http://127.0.0.1:8000/readyz/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      <<: *awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /review-master/prod
        awslogs-stream: web
        awslogs-create-group: "true"

  worker:
    <<: *app
    command: >-
      celery -A config worker
      -Q google-sync,ai-enrichment-high,ai-enrichment-low,tag-merge,default
      --concurrency=2
      --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # `celery inspect ping` returns exit 0 only if a worker responds within
      # --timeout seconds. Pipe stdout to /dev/null to avoid BrokenPipeError
      # when grep -q closed the pipe before celery finished echoing (Sentry
      # PYTHON-DJANGO-4 — 535 events from this single line).
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 5 >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    logging:
      <<: *awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /review-master/prod
        awslogs-stream: worker
        awslogs-create-group: "true"

  beat:
    <<: *app
    command: >-
      celery -A config beat
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
      --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
      # Beat must NOT enqueue tasks before worker has the new code, or worker
      # raises KeyError on unregistered tasks added in the same deploy
      # (Sentry PYTHON-DJANGO-X — happened with publish_celery_queue_depths_task).
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/*/cmdline 2>/dev/null | tr '\\0' ' ' | grep -q 'celery.*beat'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      <<: *awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /review-master/prod
        awslogs-stream: beat
        awslogs-create-group: "true"

  flower:
    <<: *app
    command: celery -A config flower --port=5555 --address=0.0.0.0
    ports:
      - "127.0.0.1:5555:5555"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5555/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      <<: *awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /review-master/prod
        awslogs-stream: flower
        awslogs-create-group: "true"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      <<: *awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /review-master/prod
        awslogs-stream: redis
        awslogs-create-group: "true"

volumes:
  caddy_data:
  caddy_config:
  redis_data:
