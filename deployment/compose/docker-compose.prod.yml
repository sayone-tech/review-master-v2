# Production Docker Compose for the single-EC2 deployment.
# See deployment/README.md for the full architecture.
#
# Usage on the EC2 box:
#   1. Pull SSM params into /etc/review-master/app.env (see scripts/fetch-ssm-env.sh)
#   2. docker compose --env-file /etc/review-master/app.env -f docker-compose.prod.yml pull
#   3. docker compose --env-file /etc/review-master/app.env -f docker-compose.prod.yml up -d
#
# The image is built and pushed by GitHub Actions to ECR. This file does not
# build — it only runs.

x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: redis://redis:6379
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini-2024-07-18}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-review-platform-prod}
  SENTRY_DSN: ${SENTRY_DSN:-}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
  AWS_S3_REGION_NAME: ${AWS_REGION:-us-east-1}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  DEFAULT_REPLY_TO: ${DEFAULT_REPLY_TO}
  ENVIRONMENT: production

x-app-image: &app-image
  image: ${ECR_REGISTRY}/review-master/app:${IMAGE_TAG:-latest}

x-logging: &awslogs
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:-us-east-1}
    awslogs-group: /review-master/prod
    awslogs-create-group: "true"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging:
      <<: *awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /review-master/prod
        awslogs-stream-prefix: caddy
        awslogs-create-group: "true"

  web:
    <<: *app-image
    restart: unless-stopped
    command: >-
      daphne -b 0.0.0.0 -p 8000
      --proxy-headers
      config.asgi:application
    environment:
      <<: *app-env
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      <<: *awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /review-master/prod
        awslogs-stream-prefix: web
        awslogs-create-group: "true"

  worker:
    <<: *app-image
    restart: unless-stopped
    command: >-
      celery -A config worker
      -Q google-sync,ai-enrichment,default
      --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      --loglevel=info
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 5 2>&1 | grep -q OK"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    logging:
      <<: *awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /review-master/prod
        awslogs-stream-prefix: worker
        awslogs-create-group: "true"

  beat:
    <<: *app-image
    restart: unless-stopped
    # CLAUDE.md §12.6 — exactly one Beat instance.
    command: >-
      celery -A config beat
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
      --loglevel=info
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/*/cmdline 2>/dev/null | tr '\\0' ' ' | grep -q 'celery.*beat'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      <<: *awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /review-master/prod
        awslogs-stream-prefix: beat
        awslogs-create-group: "true"

  flower:
    <<: *app-image
    restart: unless-stopped
    # Bound to localhost only — access via SSH tunnel:
    #   ssh -L 5555:localhost:5555 ec2-user@<ec2-host>
    # Basic-auth credentials come from FLOWER_BASIC_AUTH (user:pass).
    command: >-
      celery -A config flower
      --port=5555
      --basic_auth=${FLOWER_BASIC_AUTH}
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5555/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      <<: *awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /review-master/prod
        awslogs-stream-prefix: flower
        awslogs-create-group: "true"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      <<: *awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /review-master/prod
        awslogs-stream-prefix: redis
        awslogs-create-group: "true"

volumes:
  caddy_data:
  caddy_config:
  redis_data:
