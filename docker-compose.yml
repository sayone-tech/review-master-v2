services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reviewmaster
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "reviewmaster"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/"]
      interval: 10s
      timeout: 3s
      retries: 3

  vite:
    image: node:22-alpine
    working_dir: /app/frontend
    command: >-
      sh -c "npm install &&
             npm run css:build &&
             test -s /app/static/css/tailwind.css || npm run css:build &&
             (npm run css:watch & npm run dev -- --host 0.0.0.0)"
    volumes:
      - .:/app
      - vite_node_modules:/app/frontend/node_modules
      - static_css:/app/static/css
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/static/dist/@vite/client"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "uv sync --frozen && python manage.py migrate --run-syncdb && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: dev-insecure-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DJANGO_VITE_DEV_MODE: "True"
      DJANGO_VITE_DEV_SERVER_HOST: vite
      DATABASE_URL: postgres://app:app@db:5432/reviewmaster
      REDIS_URL: redis://redis:6379
      DEFAULT_FROM_EMAIL: noreply@example.com
      DEFAULT_REPLY_TO: support@example.com
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vite:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_css:/app/static/css

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "uv sync --frozen && celery -A config worker -Q google-sync,ai-enrichment-high,ai-enrichment-low,tag-merge,default --concurrency=${CELERY_WORKER_CONCURRENCY:-2} --loglevel=info"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: dev-insecure-secret
      DATABASE_URL: postgres://app:app@db:5432/reviewmaster
      REDIS_URL: redis://redis:6379
      CELERY_WORKER_CONCURRENCY: "2"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # Ping all registered workers via the broker. Exits 0 if at least one responds.
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 5 2>&1 | grep -q OK"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    volumes:
      - .:/app

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "uv sync --frozen && celery -A config beat --scheduler django_celery_beat.schedulers:DatabaseScheduler --loglevel=info"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: dev-insecure-secret
      DATABASE_URL: postgres://app:app@db:5432/reviewmaster
      REDIS_URL: redis://redis:6379
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # Beat has no RPC interface; verify the celery beat process is still running.
      test: ["CMD-SHELL", "cat /proc/*/cmdline 2>/dev/null | tr '\\0' ' ' | grep -q 'celery.*beat'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - .:/app

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "uv sync --frozen && celery -A config flower --port=5555"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://app:app@db:5432/reviewmaster
      REDIS_URL: redis://redis:6379
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5555/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "5555:5555"
    volumes:
      - .:/app

volumes:
  postgres_data:
  vite_node_modules:
  static_css:
